[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nowledge-mem-langgraph"
version = "0.1.0"
description = "Identity-aware Nowledge Mem connector for LangGraph and LangChain agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nowledge Labs", email = "hello@nowledge-labs.ai" }]
keywords = ["langgraph", "langchain", "memory", "mcp", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "langchain>=1.2,<2",
  "langchain-mcp-adapters>=0.3.2,<0.4",
  "langgraph>=1.1.5,<2",
]

[project.urls]
Documentation = "https://mem.nowledge.co/docs/integrations/langgraph"
Issues = "https://github.com/nowledge-co/mem/issues"
Source = "https://github.com/nowledge-co/community/tree/main/nowledge-mem-langgraph"

[tool.hatch.build.targets.wheel]
packages = ["src/nowledge_mem_langgraph"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]

[dependency-groups]
dev = [
  "build>=1.2",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "twine>=6.1",
]
