name: Cherry Studio companion

on:
  pull_request:
    paths:
      - '.github/workflows/cherry-studio.yml'
      - 'integrations.json'
      - 'nowledge-mem-cherry-studio/**'
      - 'tests/guidance/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cherry-studio.yml'
      - 'integrations.json'
      - 'nowledge-mem-cherry-studio/**'
      - 'tests/guidance/**'

permissions:
  contents: read

jobs:
  validate:
    name: Cherry Studio (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test companion runtime
        run: python -m unittest discover -s nowledge-mem-cherry-studio/tests -v
      - name: Validate registry and version contracts
        run: python -m unittest discover -s tests/guidance -v
      - name: Build and install the package
        run: python -m pip install ./nowledge-mem-cherry-studio
      - name: Verify installed entry point
        run: nowledge-mem-cherry-studio --version
