name: OpenHands plugin

on:
  pull_request:
    paths:
      - ".github/workflows/openhands-plugin.yml"
      - "nowledge-mem-openhands-plugin/**"
      - "tests/plugin_e2e/test_openhands_plugin.py"
      - "tests/plugin_e2e/test_mcp_endpoint_contract.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openhands-plugin.yml"
      - "nowledge-mem-openhands-plugin/**"
      - "tests/plugin_e2e/test_openhands_plugin.py"
      - "tests/plugin_e2e/test_mcp_endpoint_contract.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenHands SDK and test tools
        run: python -m pip install "openhands-sdk==1.50.1" "pytest>=8,<9" "ruff==0.11.10"
      - name: Lint hooks and tests
        run: ruff check nowledge-mem-openhands-plugin/hooks tests/plugin_e2e/test_openhands_plugin.py
      - name: Test plugin, SDK load, and MCP URL contract
        run: python -m pytest tests/plugin_e2e/test_openhands_plugin.py tests/plugin_e2e/test_mcp_endpoint_contract.py -q
