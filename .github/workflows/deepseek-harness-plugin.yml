name: DeepSeek Harness plugin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deepseek-harness-plugin.yml'
      - 'nowledge-mem-deepseek-harness-plugin/**'
      - 'integrations.json'
      - 'tests/plugin_e2e/test_key_plugins_e2e.py'
  pull_request:
    paths:
      - '.github/workflows/deepseek-harness-plugin.yml'
      - 'nowledge-mem-deepseek-harness-plugin/**'
      - 'integrations.json'
      - 'tests/plugin_e2e/test_key_plugins_e2e.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: DSH lint and registry contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nowledge-mem-deepseek-harness-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nowledge-mem-deepseek-harness-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Verify community DSH registry and package contract
        working-directory: .
        run: >-
          python -m pytest
          tests/plugin_e2e/test_key_plugins_e2e.py::test_deepseek_harness_plugin_static_contract_is_self_contained
          -q

  test:
    name: Test (${{ matrix.os }}, DSH ${{ matrix.host.dsh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        host:
          - dsh: 0.1.7-rc.1
            cordis: 4.0.4
          - dsh: 0.2.1-alpha.1
            cordis: 4.0.5-alpha.1
          - dsh: 0.2.1-rc.2
            cordis: 4.0.5
          - dsh: 0.2.1-rc.3
            cordis: 4.0.5
          - dsh: 0.2.1-rc.5
            cordis: 4.0.5
          - dsh: 0.2.2-rc.1
            cordis: 4.1.0
          - dsh: 0.2.2-rc.2
            cordis: 4.1.0
    defaults:
      run:
        shell: bash
        working-directory: nowledge-mem-deepseek-harness-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nowledge-mem-deepseek-harness-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install DSH host compatibility baseline
        if: matrix.host.dsh != '0.2.1-alpha.1' && matrix.host.dsh != '0.2.2-rc.2'
        run: >-
          npm install --ignore-scripts --no-save --no-package-lock
          @deepseek-ai/cordis@${{ matrix.host.cordis }}
          @deepseek-ai/dsh-llm@${{ matrix.host.dsh }}
          @deepseek-ai/dsh-session@${{ matrix.host.dsh }}
          @deepseek-ai/dsh-session-format-v3-to-v4@${{ matrix.host.dsh }}
      - name: Install optional historical-backfill SDK contracts
        if: matrix.host.dsh == '0.2.2-rc.2'
        run: >-
          npm install --ignore-scripts --no-save --no-package-lock
          @deepseek-ai/cordis@4.1.0
          @deepseek-ai/dsh-llm@0.2.2-rc.2
          @deepseek-ai/dsh-session@0.2.2-rc.2
          @deepseek-ai/dsh-session-format-v3-to-v4@0.2.2-rc.2
          @deepseek-ai/dsh-commands@0.2.2-rc.2
          @deepseek-ai/dsh-session-query@0.2.2-rc.2
      - run: npm test
        env:
          DSH_HISTORY_NATIVE_TEST: ${{ matrix.host.dsh == '0.2.2-rc.2' }}
      - run: npm pack --dry-run

  installed-host:
    name: Installed DSH headless capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nowledge-mem-deepseek-harness-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nowledge-mem-deepseek-harness-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install one coherent isolated host SDK and launcher
        run: >-
          npm install --ignore-scripts --no-save --no-package-lock
          @deepseek-ai/cordis@4.1.0
          @deepseek-ai/dsh-llm@0.2.2-rc.2
          @deepseek-ai/dsh-session@0.2.2-rc.2
          @deepseek-ai/dsh-session-format-v3-to-v4@0.2.2-rc.2
          @deepseek-ai/dsh-commands@0.2.2-rc.2
          @deepseek-ai/dsh-session-query@0.2.2-rc.2
          @deepseek-ai/dsh@0.2.2-rc.2
          @deepseek-ai/dsh-llm-mock-server@0.2.2-rc.2
          pnpm@12.15.0
      - run: node --import ./tests/setup.mjs --test tests/installed-host.test.mjs
        env:
          DSH_INSTALLED_HOST_TEST: 'true'
