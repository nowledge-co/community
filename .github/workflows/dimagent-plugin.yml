name: DimAgent plugin

on:
  pull_request:
    paths:
      - ".github/workflows/dimagent-plugin.yml"
      - ".agents/plugins/marketplace.json"
      - "integrations.json"
      - "nowledge-mem-dimagent-plugin/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dimagent-plugin.yml"
      - ".agents/plugins/marketplace.json"
      - "integrations.json"
      - "nowledge-mem-dimagent-plugin/**"

permissions:
  contents: read

jobs:
  validate:
    name: DimAgent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Test DimAgent runtime, registered launchers and registry contract
        run: python -m unittest discover -s nowledge-mem-dimagent-plugin/tests -v
