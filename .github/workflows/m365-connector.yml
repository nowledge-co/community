name: Microsoft 365 connector
on:
  pull_request:
    paths: ['nowledge-mem-m365-connector/**', 'tests/plugin_e2e/test_m365_connector.py', 'integrations.json', '.github/workflows/m365-connector.yml']
  push:
    branches: [main]
    paths: ['nowledge-mem-m365-connector/**', 'tests/plugin_e2e/test_m365_connector.py', 'integrations.json', '.github/workflows/m365-connector.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest tests/plugin_e2e/test_m365_connector.py -q
