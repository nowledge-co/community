name: Alma plugin behavior

on:
  pull_request:
    paths:
      - 'nowledge-mem-alma-plugin/**'
      - '.github/workflows/alma-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'nowledge-mem-alma-plugin/**'
      - '.github/workflows/alma-plugin.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: nowledge-mem-alma-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
