name: Devin Plugin

on:
  push:
    paths:
      - ".github/workflows/devin-plugin.yml"
      - "integrations.json"
      - "nowledge-mem-devin-plugin/**"
  pull_request:
    paths:
      - ".github/workflows/devin-plugin.yml"
      - "integrations.json"
      - "nowledge-mem-devin-plugin/**"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate native Devin plugin contract
        run: node nowledge-mem-devin-plugin/scripts/validate-plugin.mjs
