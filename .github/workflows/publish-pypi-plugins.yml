name: Publish PyPI plugins
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Package to publish
        required: true
        type: choice
        options: [bub, langgraph]
      version:
        description: Exact stable version merged into main
        required: true
        type: string
      commit:
        description: Full reviewed main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-pypi-${{ inputs.plugin }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'nowledge-co/community' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_PLUGIN: ${{ inputs.plugin }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Validate exact commit
        run: '[[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require merged main ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata and immutable version
        run: python scripts/plugin-release.py preflight "$RELEASE_PLUGIN" "$RELEASE_VERSION"
      - name: Select allowlisted package
        run: |
          case "$RELEASE_PLUGIN" in
            bub) directory=nowledge-mem-bub-plugin ;;
            langgraph) directory=nowledge-mem-langgraph ;;
            *) exit 1 ;;
          esac
          echo "PACKAGE_DIR=$directory" >> "$GITHUB_ENV"
      - name: Test and build
        run: |
          python -m pip install build twine pytest
          python -m pytest tests/plugin_e2e/test_key_plugins_e2e.py -q -k 'save_surfaces_do_not_default_omitted_unit_type_to_fact or key_plugin_credentials_stay_out_of_static_runtime_urls'
          python -m compileall -q "$PACKAGE_DIR/src"
          if [ "$RELEASE_PLUGIN" = langgraph ]; then
            python -m pip install "./$PACKAGE_DIR" pytest-asyncio
            python -m pytest "$PACKAGE_DIR/tests" -q
          fi
          python -m build "$PACKAGE_DIR" --outdir dist
          python -m twine check dist/*
          python -m pip install --no-deps dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_PLUGIN: ${{ inputs.plugin }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Validate exact commit
        run: '[[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require merged main ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify exact wheel and sdist hashes
        run: python scripts/plugin-release.py verify "$RELEASE_PLUGIN" "$RELEASE_VERSION" --artifact dist
